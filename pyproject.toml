[project]
name = "nutrigo-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "openai>=1.44",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ingest = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "playwright>=1.47",
  "pillow>=10.4",
  "pytesseract>=0.3.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
 